[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88.0"
authors = [
    "chayleaf <chayleaf-cratesio@pavluk.org>",
    "Matej Škvarč <matej.skvarc@senlab.io>",
]
license = "0BSD OR MIT OR Apache-2.0"
repository = "https://github.com/mskvarc/urn-rs/"

[workspace.dependencies]
urn-rs-core = { path = "crates/urn-rs-core", version = "1.0.0", default-features = false }
urn-rs-static = { path = "crates/urn-rs-static", version = "1.0.0" }

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
branches_sharing_code = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cloned_instead_of_copied = "warn"
expect_used = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
multiple_unsafe_ops_per_block = "deny"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_self_imports = "warn"
unreachable = "deny"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
