[package]
name = "urn-rs"
description = "Parse, validate, and build URNs per RFC 8141"
version = "0.9.2"
edition = "2024"
rust-version = "1.85.0"
authors = [
    "chayleaf <chayleaf-cratesio@pavluk.org>",
    "Matej Škvarč <matej.skvarc@senlab.io>",
]
license = "0BSD OR MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/mskvarc/urn-rs/"
keywords = ["urn", "uri", "iana", "namespace", "parser"]
categories = ["parser-implementations", "web-programming", "encoding"]
autobenches = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
std = ["alloc"]
default = ["std"]
alloc = ["serde?/alloc"]
# Compare/hash/order the entire URN (including r/q/f-components) instead of
# only the RFC 8141 §3 equivalence portion (scheme + NID + NSS).
exact-eq = []

[dependencies]
serde = { version = "1.0.228", default-features = false, optional = true }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
criterion = "0.8.2"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints]
workspace = true

[workspace]
members = ["urn-rs-static"]

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
branches_sharing_code = "warn"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cloned_instead_of_copied = "warn"
expect_used = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
missing_const_for_fn = "warn"
multiple_unsafe_ops_per_block = "deny"
needless_collect = "warn"
panic = "deny"
redundant_clone = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unnecessary_self_imports = "warn"
unreachable = "deny"
unwrap_used = "deny"
used_underscore_binding = "warn"
wildcard_dependencies = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"

[[bench]]
name = "parse"
harness = false
required-features = ["alloc"]

[[bench]]
name = "percent"
harness = false
required-features = ["alloc"]

[[bench]]
name = "builder_accessors"
harness = false
required-features = ["alloc"]

[[bench]]
name = "setters"
harness = false
required-features = ["alloc"]

[[bench]]
name = "serde"
harness = false
required-features = ["alloc", "serde"]
