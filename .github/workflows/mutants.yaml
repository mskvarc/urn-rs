name: mutants

# A full mutation run takes too long for every push, so it runs weekly and on demand.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  mutants:
    name: cargo mutants (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # Always with all features: cargo-mutants ignores `cfg`, so in another feature set it reports code that was never
      # compiled as missed. `.cargo/mutants.toml` lists the equivalent mutants no test can catch.
      - run: cargo mutants --all-features --in-place --shard ${{ matrix.shard }}/4 --cargo-arg=--locked
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
