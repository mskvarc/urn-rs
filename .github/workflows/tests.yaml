name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# A Dependabot pull request runs the quick check in check.yaml instead.
jobs:
  test:
    name: cargo test
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Library, integration and doc tests; doc tests keep every rustdoc example compiling.
      - run: cargo test --workspace --all-features --locked

  # Some tests only exist without a feature, such as the ones that check what fails without `alloc`, so the
  # all-features run above never sees them. Each run tests one package: in a workspace build, dev-dependencies turn on
  # `std`.
  test-features:
    name: cargo test (urn-rs-core, ${{ matrix.name }})
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no features
            features: ""
          - name: alloc
            features: alloc
          - name: serde
            features: serde
          - name: alloc, serde
            features: alloc,serde
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test -p urn-rs-core --no-default-features --features "${{ matrix.features }}" --locked
