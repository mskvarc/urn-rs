[package]
name = "urn-rs"
description = "Parse, validate, and build URNs per RFC 8141"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../README.md"
repository.workspace = true
keywords = ["urn", "uri", "rfc8141", "identifier", "percent-encoding"]
categories = ["parser-implementations", "encoding", "no-std", "no-std::no-alloc", "web-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
std = ["alloc", "urn-rs-core/std"]
default = ["std"]
alloc = ["urn-rs-core/alloc"]
serde = ["urn-rs-core/serde"]
# The `urn!` macro for compile-time checked URN literals.
static = ["dep:urn-rs-static"]

[dependencies]
urn-rs-core.workspace = true
urn-rs-static = { workspace = true, optional = true }

[lints]
workspace = true

[[test]]
name = "static"
required-features = ["static"]
