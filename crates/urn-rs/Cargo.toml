[package]
name = "urn-rs"
description = "Parse, validate, and build URNs per RFC 8141"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../README.md"
repository = "https://github.com/mskvarc/urn-rs/"
keywords = ["urn", "uri", "iana", "namespace", "parser"]
categories = ["parser-implementations", "web-programming", "encoding"]
autobenches = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
std = ["alloc"]
default = ["std"]
alloc = ["serde?/alloc"]
# Compare/hash/order the entire URN (including r/q/f-components) instead of
# only the RFC 8141 §3 equivalence portion (scheme + NID + NSS).
exact-eq = []

[dependencies]
serde = { version = "1.0.228", default-features = false, optional = true }
thiserror = { version = "2.0.18", default-features = false }

[dev-dependencies]
criterion = "0.8.2"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints]
workspace = true

[[bench]]
name = "parse"
harness = false
required-features = ["alloc"]

[[bench]]
name = "percent"
harness = false
required-features = ["alloc"]

[[bench]]
name = "builder_accessors"
harness = false
required-features = ["alloc"]

[[bench]]
name = "setters"
harness = false
required-features = ["alloc"]

[[bench]]
name = "serde"
harness = false
required-features = ["alloc", "serde"]
