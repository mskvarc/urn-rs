[package]
name = "urn-rs"
description = "Parse, validate, and build URNs per RFC 8141"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["urn", "uri", "iana", "namespace", "parser"]
categories = ["parser-implementations", "web-programming", "encoding"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
std = ["alloc", "urn-rs-core/std"]
default = ["std"]
alloc = ["urn-rs-core/alloc"]
serde = ["urn-rs-core/serde"]
# Compare/hash/order the entire URN (including r/q/f-components) instead of
# only the RFC 8141 §3 equivalence portion (scheme + NID + NSS).
exact-eq = ["urn-rs-core/exact-eq"]
# The `urn!` macro for compile-time checked URN literals.
static = ["dep:urn-rs-static"]

[dependencies]
urn-rs-core.workspace = true
urn-rs-static = { workspace = true, optional = true }

[lints]
workspace = true

[[test]]
name = "static"
required-features = ["static"]
