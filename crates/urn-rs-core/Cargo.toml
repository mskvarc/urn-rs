[package]
name = "urn-rs-core"
description = "Core types and parser for urn-rs. Use the urn-rs crate instead of depending on this one directly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
autobenches = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
std = ["alloc"]
default = ["std"]
alloc = ["serde?/alloc"]

[dependencies]
serde = { version = "1.0.229", default-features = false, optional = true }
thiserror = { version = "2.0.21", default-features = false }

[dev-dependencies]
criterion = "0.8.2"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Lets the doctests, tests and benches use the `urn_rs::` paths users see. Path-only, so
# `cargo publish` drops it and publishing has no cycle. No default features, so it doesn't
# turn on `std` in no_std test builds.
urn-rs = { path = "../urn-rs", default-features = false }

[lints]
workspace = true

[[bench]]
name = "parse"
harness = false
required-features = ["alloc"]

[[bench]]
name = "percent"
harness = false
required-features = ["alloc"]

[[bench]]
name = "builder_accessors"
harness = false
required-features = ["alloc"]

[[bench]]
name = "setters"
harness = false
required-features = ["alloc"]

[[bench]]
name = "serde"
harness = false
required-features = ["alloc", "serde"]
