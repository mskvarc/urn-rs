[package]
name = "urn-rs-static"
description = "Compile-time checked URN literals for urn-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["urn", "macro", "compile-time", "literal", "rfc8141"]
categories = ["parser-implementations", "no-std", "no-std::no-alloc"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.10"
urn-rs-core = { workspace = true, features = ["alloc"] }

[dev-dependencies]
# Doctests and tests use the macro the way users do, through `urn-rs`. Path-only, so
# `cargo publish` drops it and publishing has no cycle.
urn-rs = { path = "../urn-rs" }

[lints]
workspace = true
