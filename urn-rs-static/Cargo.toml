[package]
name = "urn-rs-static"
description = "Compile-time checked URN literals for urn-rs"
version = "0.9.2"
edition = "2024"
rust-version = "1.85.0"
license = "0BSD OR MIT OR Apache-2.0"
readme = "README.md"
keywords = ["urn", "macro", "const", "compile-time", "rfc8141"]
categories = ["parser-implementations", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.3"
urn-rs = { path = "..", version = "0.9.2" }

[lints]
workspace = true
